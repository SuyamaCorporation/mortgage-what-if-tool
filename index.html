<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>住宅ローン「もしも」シミュレータ</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  *:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }
  input[type=range] { accent-color: #6366f1; }
</style>
</head>
<body class="bg-gray-50 min-h-screen text-gray-800">
<div class="max-w-4xl mx-auto px-4 py-8">
  <header class="text-center mb-8">
    <h1 class="text-2xl font-bold text-indigo-700">住宅ローン「もしも」シミュレータ</h1>
    <p class="text-sm text-gray-500 mt-1">繰り上げ返済・金利変動・期間短縮を即試算</p>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <!-- 入力パネル -->
    <div class="space-y-5">
      <div class="bg-white rounded-2xl shadow-sm p-5">
        <h2 class="font-semibold text-gray-700 mb-4">基本設定</h2>
        <div class="space-y-4">
          <div>
            <div class="flex justify-between text-sm mb-1">
              <label for="loan-amount">借入金額</label>
              <span class="text-indigo-600 font-mono" id="loan-amount-display">3,000万円</span>
            </div>
            <input id="loan-amount" type="range" min="500" max="10000" step="100" value="3000"
              oninput="updateAll()" class="w-full" aria-label="借入金額">
          </div>
          <div>
            <div class="flex justify-between text-sm mb-1">
              <label for="rate">金利（年）</label>
              <span class="text-indigo-600 font-mono" id="rate-display">1.5%</span>
            </div>
            <input id="rate" type="range" min="0.1" max="5.0" step="0.1" value="1.5"
              oninput="updateAll()" class="w-full" aria-label="金利">
          </div>
          <div>
            <div class="flex justify-between text-sm mb-1">
              <label for="years">返済期間</label>
              <span class="text-indigo-600 font-mono" id="years-display">35年</span>
            </div>
            <input id="years" type="range" min="5" max="50" step="1" value="35"
              oninput="updateAll()" class="w-full" aria-label="返済期間">
          </div>
          <div class="flex gap-2 pt-1">
            <label class="text-sm text-gray-600">返済方式:</label>
            <label class="flex items-center gap-1 text-sm cursor-pointer">
              <input type="radio" name="method" value="equal-payment" checked onchange="updateAll()"> 元利均等
            </label>
            <label class="flex items-center gap-1 text-sm cursor-pointer">
              <input type="radio" name="method" value="equal-principal" onchange="updateAll()"> 元金均等
            </label>
          </div>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm p-5">
        <h2 class="font-semibold text-gray-700 mb-4">繰り上げ返済シミュレーション</h2>
        <div>
          <div class="flex justify-between text-sm mb-1">
            <label for="extra">毎月追加返済額</label>
            <span class="text-indigo-600 font-mono" id="extra-display">0万円</span>
          </div>
          <input id="extra" type="range" min="0" max="20" step="0.5" value="0"
            oninput="updateAll()" class="w-full" aria-label="毎月追加返済額">
        </div>
        <div class="mt-4 grid grid-cols-2 gap-3 text-center">
          <div class="bg-green-50 rounded-xl p-3">
            <div class="text-xs text-gray-500 mb-1">期間短縮</div>
            <div class="text-lg font-bold text-green-600" id="saved-years">-</div>
          </div>
          <div class="bg-indigo-50 rounded-xl p-3">
            <div class="text-xs text-gray-500 mb-1">利息節約額</div>
            <div class="text-lg font-bold text-indigo-600" id="saved-interest">-</div>
          </div>
        </div>
      </div>

      <!-- 金利変動試算 -->
      <div class="bg-white rounded-2xl shadow-sm p-5">
        <h2 class="font-semibold text-gray-700 mb-3">金利変動シナリオ</h2>
        <div class="space-y-2 text-sm" id="rate-scenarios"></div>
      </div>
    </div>

    <!-- 右パネル -->
    <div class="space-y-5">
      <!-- 試算結果 -->
      <div class="bg-indigo-600 text-white rounded-2xl shadow-sm p-5">
        <h2 class="font-semibold mb-4">試算結果</h2>
        <div class="grid grid-cols-3 gap-3 text-center">
          <div>
            <div class="text-xs opacity-70 mb-1">月々返済額</div>
            <div class="text-xl font-bold" id="monthly-payment">-</div>
          </div>
          <div>
            <div class="text-xs opacity-70 mb-1">総返済額</div>
            <div class="text-lg font-bold" id="total-payment">-</div>
          </div>
          <div>
            <div class="text-xs opacity-70 mb-1">総支払利息</div>
            <div class="text-lg font-bold" id="total-interest">-</div>
          </div>
        </div>
      </div>

      <!-- グラフ -->
      <div class="bg-white rounded-2xl shadow-sm p-5">
        <div class="flex items-center gap-4 mb-3 text-xs">
          <span class="flex items-center gap-1"><span class="inline-block w-3 h-1 bg-indigo-500 rounded"></span>繰上げなし</span>
          <span class="flex items-center gap-1"><span class="inline-block w-3 h-1 bg-green-500 rounded"></span>繰上げあり</span>
        </div>
        <canvas id="chart" width="500" height="280" aria-label="元金残高推移グラフ" role="img"></canvas>
      </div>
    </div>
  </div>
</div>

<script>
function fmt(yen) {
  if (yen >= 10000) return (yen/10000).toFixed(1) + '億円';
  return Math.round(yen/10000*10)/10 + '万円';
}
function fmtMan(val) { return Math.round(val).toLocaleString() + '万円'; }

function getMethod() { return document.querySelector('input[name=method]:checked').value; }

// 元利均等 月返済額
function calcEqualPayment(principal, annualRate, months) {
  if (annualRate === 0) return principal / months;
  const r = annualRate / 12 / 100;
  return principal * r * Math.pow(1+r, months) / (Math.pow(1+r, months) - 1);
}

// 月ごと残高配列 (元利均等)
function buildSchedule(principal, annualRate, months, extraMonthly = 0) {
  const r = annualRate / 12 / 100;
  const mp = calcEqualPayment(principal, annualRate, months);
  let bal = principal;
  const balances = [bal];
  let totalInterest = 0;
  let actualMonths = 0;
  for (let i = 0; i < months; i++) {
    if (bal <= 0) break;
    const interest = bal * r;
    totalInterest += interest;
    const principal_part = mp - interest;
    bal = Math.max(0, bal - principal_part - extraMonthly * 10000);
    balances.push(bal);
    actualMonths = i + 1;
    if (bal <= 0) break;
  }
  return { balances, totalInterest, actualMonths };
}

// 元金均等
function buildScheduleEqualPrincipal(principal, annualRate, months, extraMonthly = 0) {
  const r = annualRate / 12 / 100;
  const pPerMonth = principal / months;
  let bal = principal;
  const balances = [bal];
  let totalInterest = 0;
  let actualMonths = 0;
  for (let i = 0; i < months; i++) {
    if (bal <= 0) break;
    const interest = bal * r;
    totalInterest += interest;
    bal = Math.max(0, bal - pPerMonth - extraMonthly * 10000);
    balances.push(bal);
    actualMonths = i + 1;
    if (bal <= 0) break;
  }
  return { balances, totalInterest, actualMonths };
}

function updateAll() {
  const amount = parseFloat(document.getElementById('loan-amount').value) * 10000;
  const rate = parseFloat(document.getElementById('rate').value);
  const years = parseInt(document.getElementById('years').value);
  const extra = parseFloat(document.getElementById('extra').value);
  const months = years * 12;
  const method = getMethod();

  document.getElementById('loan-amount-display').textContent = (amount/10000).toLocaleString() + '万円';
  document.getElementById('rate-display').textContent = rate.toFixed(1) + '%';
  document.getElementById('years-display').textContent = years + '年';
  document.getElementById('extra-display').textContent = extra + '万円';

  let baseResult, extraResult;
  if (method === 'equal-payment') {
    baseResult = buildSchedule(amount, rate, months, 0);
    extraResult = buildSchedule(amount, rate, months, extra);
    const mp = calcEqualPayment(amount, rate, months);
    document.getElementById('monthly-payment').textContent = Math.round(mp/10000*10)/10 + '万円';
  } else {
    baseResult = buildScheduleEqualPrincipal(amount, rate, months, 0);
    extraResult = buildScheduleEqualPrincipal(amount, rate, months, extra);
    const firstInterest = amount * rate / 12 / 100;
    const firstPrincipal = amount / months;
    document.getElementById('monthly-payment').textContent = '初月:' + Math.round((firstPrincipal + firstInterest)/10000*10)/10 + '万円';
  }

  const totalPay = amount + baseResult.totalInterest;
  document.getElementById('total-payment').textContent = Math.round(totalPay/10000) + '万円';
  document.getElementById('total-interest').textContent = Math.round(baseResult.totalInterest/10000) + '万円';

  if (extra > 0) {
    const savedMonths = baseResult.actualMonths - extraResult.actualMonths;
    const savedYears = Math.floor(savedMonths/12);
    const savedMo = savedMonths % 12;
    document.getElementById('saved-years').textContent = savedYears > 0 ? `${savedYears}年${savedMo}ヶ月` : `${savedMo}ヶ月`;
    document.getElementById('saved-interest').textContent = Math.round((baseResult.totalInterest - extraResult.totalInterest)/10000) + '万円';
  } else {
    document.getElementById('saved-years').textContent = '-';
    document.getElementById('saved-interest').textContent = '-';
  }

  // 金利変動シナリオ
  const scenarios = [
    { label: '現在(' + rate.toFixed(1) + '%)', rate: rate, color: 'text-gray-700' },
    { label: '+0.5% (' + (rate+0.5).toFixed(1) + '%)', rate: rate+0.5, color: 'text-amber-600' },
    { label: '+1.0% (' + (rate+1).toFixed(1) + '%)', rate: rate+1, color: 'text-orange-600' },
    { label: '+2.0% (' + (rate+2).toFixed(1) + '%)', rate: rate+2, color: 'text-red-600' },
  ];
  const scenDiv = document.getElementById('rate-scenarios');
  scenDiv.innerHTML = scenarios.map(s => {
    const mp = calcEqualPayment(amount, s.rate, months);
    const r = buildSchedule(amount, s.rate, months, 0);
    return `<div class="flex justify-between items-center py-1.5 border-b border-gray-100 last:border-0">
      <span class="${s.color} font-medium">${htmlEscape(s.label)}</span>
      <div class="text-right">
        <span class="${s.color} font-mono text-sm">${Math.round(mp/10000*10)/10}万円/月</span>
        <span class="text-gray-400 text-xs ml-2">総利息 ${Math.round(r.totalInterest/10000)}万円</span>
      </div>
    </div>`;
  }).join('');

  drawChart(baseResult.balances, extraResult.balances, years);
}

function htmlEscape(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function drawChart(base, withExtra, years) {
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const pad = { top:20, right:20, bottom:40, left:60 };
  ctx.clearRect(0,0,W,H);

  const maxVal = base[0];
  const totalMonths = base.length - 1;

  function px(monthIdx) { return pad.left + (monthIdx / totalMonths) * (W - pad.left - pad.right); }
  function py(val) { return pad.top + (1 - val/maxVal) * (H - pad.top - pad.bottom); }

  // Grid
  ctx.strokeStyle = '#e5e7eb';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + i * (H - pad.top - pad.bottom) / 4;
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(W - pad.right, y); ctx.stroke();
    ctx.fillStyle = '#6b7280'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(Math.round(maxVal * (1 - i/4) / 10000) + '万', pad.left - 4, y + 4);
  }
  for (let y = 0; y <= years; y += Math.ceil(years/7)) {
    const x = px(y * 12);
    ctx.beginPath(); ctx.moveTo(x, pad.top); ctx.lineTo(x, H - pad.bottom); ctx.stroke();
    ctx.fillStyle = '#6b7280'; ctx.textAlign = 'center';
    ctx.fillText(y + '年', x, H - 10);
  }

  // Base line
  ctx.beginPath(); ctx.strokeStyle = '#6366f1'; ctx.lineWidth = 2;
  base.forEach((v, i) => { i === 0 ? ctx.moveTo(px(i), py(v)) : ctx.lineTo(px(i), py(v)); });
  ctx.stroke();

  // Extra line
  if (withExtra && withExtra.length > 1) {
    ctx.beginPath(); ctx.strokeStyle = '#22c55e'; ctx.lineWidth = 2;
    withExtra.forEach((v, i) => { i === 0 ? ctx.moveTo(px(i), py(v)) : ctx.lineTo(px(i), py(Math.max(0,v))); });
    ctx.stroke();
  }
}

updateAll();
</script>
</body>
</html>
